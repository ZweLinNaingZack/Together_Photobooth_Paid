<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
 <title id="title">Music Player photocard — layout K</title>
 <desc id="desc">Editable dark music-player photo template with blank image slots and playback controls.</desc>
 <defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17191a"/><stop offset=".48" stop-color="#090a0a"/><stop offset="1" stop-color="#1b1d1e"/></linearGradient>
  <linearGradient id="photoBlank" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#444647"/><stop offset=".5" stop-color="#292b2c"/><stop offset="1" stop-color="#484a4b"/></linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="23"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="screen"/></filter>
 </defs>
 <rect width="1800" height="1200" fill="url(#shell)"/>
 <rect width="1800" height="1200" fill="#fff" opacity=".025" filter="url(#grain)"/>
 <g id="app-header" fill="#fff" stroke="#fff" stroke-width="3" stroke-linecap="round">
  <path d="M75 40l16 16 16-16" fill="none"/>
  <text x="900" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" stroke="none">Photo Booth</text>
  <circle cx="1695" cy="50" r="4"/><circle cx="1710" cy="50" r="4"/><circle cx="1725" cy="50" r="4"/>
 </g>
 <g id="photo-slots"><g id="photo-slot-1" data-photo-slot="1"><rect x="70" y="100" width="820" height="310" rx="5" fill="url(#photoBlank)" stroke="#111314" stroke-width="4"/></g><g id="photo-slot-2" data-photo-slot="2"><rect x="70" y="430" width="820" height="320" rx="5" fill="url(#photoBlank)" stroke="#111314" stroke-width="4"/></g></g>
 <g id="caption-space"><text x="1320" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" fill="#f4f4f4" font-weight="700">Your lyrics here</text><path d="M1080 390H1570M1080 470H1570M1080 550H1570" stroke="#777" stroke-width="3"/></g>
 <g id="track-info" font-family="Arial,sans-serif">
  <text x="75" y="790" font-size="48" font-weight="700" fill="#fff">Your Title Here</text>
  <text x="75" y="838" font-size="33.599999999999994" fill="#999">Your Subtitle Here</text>
  <rect x="75" y="872" width="1650" height="5" rx="2.5" fill="#6d7072"/><rect x="75" y="872" width="247.5" height="5" rx="2.5" fill="#fff"/><circle cx="322.5" cy="874.5" r="8" fill="#fff"/>
  <text x="75" y="912" font-size="20" fill="#aaa">0:00</text><text x="1725" y="912" text-anchor="end" font-size="20" fill="#aaa">3:30</text>
 </g>
 <g id="player-controls" fill="#f8f8f8" stroke="#f8f8f8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M625 1090C597.5 1061,559 1092,625 1143C691 1092,652.5 1061,625 1090Z" fill="none" stroke-width="4"/>
  <path d="M768 1067v56M773.5 1095l48-34v68Z" stroke-width="5"/>
  <circle cx="900" cy="1095" r="49" fill="#fff"/><rect x="884" y="1073" width="10" height="44" rx="4" fill="#101112" stroke="none"/><rect x="907" y="1073" width="10" height="44" rx="4" fill="#101112" stroke="none"/>
  <path d="M1026.5 1067v56M1021 1095l-48-34v68Z" stroke-width="5"/>
  <circle cx="1175" cy="1095" r="22" fill="none" stroke-width="3"/><path d="M1166.2 1087l18 8-18 8Z"/>
 </g>
 <g id="utility-icons" stroke="#eee" fill="none" stroke-width="3"><rect x="75" y="1138" width="20" height="30" rx="3"/><rect x="100" y="1138" width="20" height="30" rx="3"/><path d="M1680 1140h38M1680 1153h38M1680 1166h38"/></g>
</svg>