<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1800" viewBox="0 0 600 1800" role="img" aria-labelledby="title desc">
  <title id="title">Photobox newspaper template — layout B</title>
  <desc id="desc">Editable vintage newspaper photocard template with empty photo slots.</desc>
  <defs>
    <filter id="paperTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
    <linearGradient id="placeholder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dedede"/><stop offset=".5" stop-color="#f0f0f0"/><stop offset="1" stop-color="#d1d1d1"/>
    </linearGradient>
    <filter id="distress" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence baseFrequency=".025" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.4"/>
    </filter>
  </defs>
  <rect width="600" height="1800" fill="#eee9df"/>
  <rect width="600" height="1800" fill="#f7f3ea" opacity=".35" filter="url(#paperTexture)"/>
  <g fill="#171717" stroke="#171717">
    <path d="M46 68H554M46 78H554" stroke-width="5"/>
    <text x="300" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="63" font-weight="900" letter-spacing="-3">BREAKING NEWS</text>
    <path d="M46 184H554" stroke-width="5"/>
    <text x="46" y="221" font-family="Arial Narrow, Impact, sans-serif" font-size="18" font-weight="700">VOL. 11, NO. 5</text>
    <text x="300" y="221" text-anchor="middle" font-family="Arial Narrow, Impact, sans-serif" font-size="18" letter-spacing="1">★   REALLYCREATSITE.COM   ★</text>
    <text x="554" y="221" text-anchor="end" font-family="Arial Narrow, Impact, sans-serif" font-size="18" font-weight="700">10 APRIL 2026</text>
    <path d="M46 238H554" stroke-width="5"/>
    <text x="300" y="368" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="108" font-weight="900" letter-spacing="4" filter="url(#distress)">PHOTOBOX</text>
    <text x="300" y="438" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="51.839999999999996" font-weight="900">BY KAMERASPACE</text>
    <path d="M46 463H554M46 473H554" stroke-width="5"/>
  </g>
  <g id="photo-slots">
    <g id="photo-slot-1" data-photo-slot="1">
      <rect x="52" y="520" width="496" height="240" rx="8" fill="url(#placeholder)" stroke="#c7c5c2" stroke-width="2"/>
    </g>
    <g id="photo-slot-2" data-photo-slot="2">
      <rect x="52" y="780" width="496" height="240" rx="8" fill="url(#placeholder)" stroke="#c7c5c2" stroke-width="2"/>
    </g>
    <g id="photo-slot-3" data-photo-slot="3">
      <rect x="52" y="1040" width="496" height="240" rx="8" fill="url(#placeholder)" stroke="#c7c5c2" stroke-width="2"/>
    </g>
    <g id="photo-slot-4" data-photo-slot="4">
      <rect x="52" y="1300" width="496" height="240" rx="8" fill="url(#placeholder)" stroke="#c7c5c2" stroke-width="2"/>
    </g></g>
  
  <g id="footer" fill="#171717" stroke="#171717">
    <path d="M46 1650H554M46 1720H554M46 1732H554" stroke-width="5"/>
    <circle cx="81" cy="1685" r="22"/><circle cx="519" cy="1685" r="22"/>
    <text x="81" y="1694" text-anchor="middle" font-family="Arial" font-size="25" fill="#f7f3ea" stroke="none">★</text>
    <text x="519" y="1694" text-anchor="middle" font-family="Arial" font-size="25" fill="#f7f3ea" stroke="none">★</text>
    <text x="300" y="1698" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="30" letter-spacing="7" stroke="none">NITTIE COFFEE &amp; EATERY</text>
  </g>
</svg>