<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
 <title id="title">Catch Yours photocard — layout C</title>
 <desc id="desc">Editable romantic photocard template with blank photo slots and ticket footer.</desc>
 <defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f4e7"/><stop offset="1" stop-color="#ece6d8"/></linearGradient>
  <linearGradient id="photoBlank"><stop stop-color="#fffdf4"/><stop offset=".52" stop-color="#f5efde"/><stop offset="1" stop-color="#fffaf0"/></linearGradient>
  <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0d8"/><stop offset="1" stop-color="#f2b3c0"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#5c352f" flood-opacity=".28"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
 </defs>
 <rect width="1200" height="1800" fill="#aa3b40"/>
 <rect x="26" y="26" width="1148" height="1748" fill="url(#paper)" opacity=".98"/>
 <rect x="26" y="26" width="1148" height="1748" fill="#f6f0e3" opacity=".10" filter="url(#grain)"/>
 <text x="600" y="125" text-anchor="middle" font-family="'Segoe Script','Brush Script MT',cursive" font-size="108" font-weight="700" fill="#a92f39">Catch</text>
 <text x="600" y="220" text-anchor="middle" font-family="'Segoe Script','Brush Script MT',cursive" font-size="108" font-weight="700" fill="#a92f39">Yours</text>
 <path d="M0 13.75 C-30.250000000000004 -9.9,-28.6 35.75,0 55 C28.6 35.75,30.250000000000004 -9.9,0 13.75Z" transform="translate(1080 70) rotate(15)" fill="#b5343f" opacity=".88"/><path d="M0 12 C-26.400000000000002 -8.64,-24.96 31.200000000000003,0 48 C24.96 31.200000000000003,26.400000000000002 -8.64,0 12Z" transform="translate(55 160) rotate(-12)" fill="#b5343f" opacity=".88"/>
 <g id="photo-slots"><g id="photo-1" data-photo-slot="1" transform="rotate(-1.1 327.5 545)">
    <rect x="65" y="330" width="525" height="430" fill="#fffefd" stroke="#d9d5ce" stroke-width="3" filter="url(#shadow)"/>
    <rect x="78.125" y="343.125" width="498.75" height="345.75" rx="3" fill="url(#photoBlank)" stroke="#ddd5c6" stroke-width="2"/>
    
  </g><g id="photo-2" data-photo-slot="2" transform="rotate(1.2 872.5 545)">
    <rect x="610" y="330" width="525" height="430" fill="#fffefd" stroke="#d9d5ce" stroke-width="3" filter="url(#shadow)"/>
    <rect x="623.125" y="343.125" width="498.75" height="345.75" rx="3" fill="url(#photoBlank)" stroke="#ddd5c6" stroke-width="2"/>
    <text x="623.125" y="742" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="28.875" fill="#181515">Chilling out</text>
  </g><g id="photo-3" data-photo-slot="3" transform="rotate(-1.1 327.5 995)">
    <rect x="65" y="780" width="525" height="430" fill="#fffefd" stroke="#d9d5ce" stroke-width="3" filter="url(#shadow)"/>
    <rect x="78.125" y="793.125" width="498.75" height="345.75" rx="3" fill="url(#photoBlank)" stroke="#ddd5c6" stroke-width="2"/>
    
  </g><g id="photo-4" data-photo-slot="4" transform="rotate(1.2 872.5 995)">
    <rect x="610" y="780" width="525" height="430" fill="#fffefd" stroke="#d9d5ce" stroke-width="3" filter="url(#shadow)"/>
    <rect x="623.125" y="793.125" width="498.75" height="345.75" rx="3" fill="url(#photoBlank)" stroke="#ddd5c6" stroke-width="2"/>
    
  </g></g>
 <path d="M0 10.75 C-23.650000000000002 -7.739999999999999,-22.36 27.95,0 43 C22.36 27.95,23.650000000000002 -7.739999999999999,0 10.75Z" transform="translate(1055 1365) rotate(15)" fill="#b5343f" opacity=".88"/><path d="M0 9 C-19.8 -6.4799999999999995,-18.72 23.400000000000002,0 36 C18.72 23.400000000000002,19.8 -6.4799999999999995,0 9Z" transform="translate(1122 1540) rotate(-8)" fill="#b5343f" opacity=".88"/>
 
 <g id="ticket-footer" transform="translate(48 1435) rotate(-1)">
  <rect width="1104" height="285" rx="12" fill="url(#ticket)" stroke="#c26978" stroke-width="3" filter="url(#shadow)"/>
  <rect x="15" y="15" width="1074" height="255" rx="9" fill="none" stroke="#a95867" stroke-width="2" stroke-dasharray="12 8"/>
  <line x1="750.72" y1="15" x2="750.72" y2="270" stroke="#a95867" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="375.36" y="99.75" text-anchor="middle" font-family="Georgia,serif" font-size="43" font-weight="900">PHOTO</text>
  <text x="375.36" y="153.9" text-anchor="middle" font-family="Georgia,serif" font-size="43" font-weight="900">TICKET</text>
  <text x="927.36" y="119.69999999999999" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">DAY</text>
  <text x="927.36" y="171" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">PASS</text>
  <text x="28" y="257" font-family="Arial,sans-serif" font-size="13">No. 001044</text>
 </g>
 <text x="1120" y="1320" text-anchor="end" font-family="Impact,'Arial Black',sans-serif" font-size="32" fill="#181515">PHOTO</text>
 <text x="1120" y="1353" text-anchor="end" font-family="Impact,'Arial Black',sans-serif" font-size="32" fill="#181515">PLACE</text>
</svg>