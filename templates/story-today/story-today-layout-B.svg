OME A MEMORY WORTH KEEPING.</text><text x="55" y="1397" font-family="Georgia" font-size="19" font-style="italic">Every photo becomes a chapter that you can revisit whenever you want.</text><rect x="55" y="1445" width="490" height="48"/><text x="300" y="1478" text-anchor="middle" fill="#fff" font-family="Georgia" font-size="17" font-style="italic">PHOTOBOOTH   ✱   MOMENKU STUDIO   ✱   NEWSPAPER</text></g></svg>