<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
 <title id="title">Music Player photocard — layout E</title>
 <desc id="desc">Editable dark music-player photo template with blank image slots and playback controls.</desc>
 <defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17191a"/><stop offset=".48" stop-color="#090a0a"/><stop offset="1" stop-color="#1b1d1e"/></linearGradient>
  <linearGradient id="photoBlank" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#444647"/><stop offset=".5" stop-color="#292b2c"/><stop offset="1" stop-color="#484a4b"/></linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="23"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="screen"/></filter>
 </defs>
 <rect width="1200" height="1800" fill="url(#shell)"/>
 <rect width="1200" height="1800" fill="#fff" opacity=".025" filter="url(#grain)"/>
 <g id="app-header" fill="#fff" stroke="#fff" stroke-width="3" stroke-linecap="round">
  <path d="M50 40l16 16 16-16" fill="none"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" stroke="none">Photo Booth</text>
  <circle cx="1120" cy="50" r="4"/><circle cx="1135" cy="50" r="4"/><circle cx="1150" cy="50" r="4"/>
 </g>
 <g id="photo-slots"><g id="photo-slot-1" data-photo-slot="1"><rect x="60" y="110" width="1080" height="435" rx="5" fill="url(#photoBlank)" stroke="#111314" stroke-width="4"/></g><g id="photo-slot-2" data-photo-slot="2"><rect x="60" y="565" width="1080" height="435" rx="5" fill="url(#photoBlank)" stroke="#111314" stroke-width="4"/></g></g>
 
 <g id="track-info" font-family="Arial,sans-serif">
  <text x="50" y="1305" font-size="42" font-weight="700" fill="#fff">Your Title Here</text>
  <text x="50" y="1353" font-size="29.4" fill="#999">Your Subtitle Here</text>
  <rect x="50" y="1387" width="1100" height="5" rx="2.5" fill="#6d7072"/><rect x="50" y="1387" width="165" height="5" rx="2.5" fill="#fff"/><circle cx="215" cy="1389.5" r="8" fill="#fff"/>
  <text x="50" y="1427" font-size="20" fill="#aaa">0:00</text><text x="1150" y="1427" text-anchor="end" font-size="20" fill="#aaa">3:30</text>
 </g>
 <g id="player-controls" fill="#f8f8f8" stroke="#f8f8f8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M350 1645C325 1616,290 1647,350 1698C410 1647,375 1616,350 1645Z" fill="none" stroke-width="4"/>
  <path d="M480 1622v56M485 1650l48-34v68Z" stroke-width="5"/>
  <circle cx="600" cy="1650" r="49" fill="#fff"/><rect x="584" y="1628" width="10" height="44" rx="4" fill="#101112" stroke="none"/><rect x="607" y="1628" width="10" height="44" rx="4" fill="#101112" stroke="none"/>
  <path d="M715 1622v56M710 1650l-48-34v68Z" stroke-width="5"/>
  <circle cx="850" cy="1650" r="22" fill="none" stroke-width="3"/><path d="M842 1642l18 8-18 8Z"/>
 </g>
 <g id="utility-icons" stroke="#eee" fill="none" stroke-width="3"><rect x="50" y="1738" width="20" height="30" rx="3"/><rect x="75" y="1738" width="20" height="30" rx="3"/><path d="M1105 1740h38M1105 1753h38M1105 1766h38"/></g>
</svg>