<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1800" viewBox="0 0 600 1800" role="img" aria-labelledby="title desc">
 <title id="title">Music Player photocard — layout A</title>
 <desc id="desc">Editable dark music-player photo template with blank image slots and playback controls.</desc>
 <defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17191a"/><stop offset=".48" stop-color="#090a0a"/><stop offset="1" stop-color="#1b1d1e"/></linearGradient>
  <linearGradient id="photoBlank" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#444647"/><stop offset=".5" stop-color="#292b2c"/><stop offset="1" stop-color="#484a4b"/></linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="23"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="screen"/></filter>
 </defs>
 <rect width="600" height="1800" fill="url(#shell)"/>
 <rect width="600" height="1800" fill="#fff" opacity=".025" filter="url(#grain)"/>
 <g id="app-header" fill="#fff" stroke="#fff" stroke-width="3" stroke-linecap="round">
  <path d="M50 40l16 16 16-16" fill="none"/>
  <text x="300" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" stroke="none">Photo Booth</text>
  <circle cx="520" cy="50" r="4"/><circle cx="535" cy="50" r="4"/><circle cx="550" cy="50" r="4"/>
 </g>
 <g id="photo-slots"><g id="photo-slot-1" data-photo-slot="1"><rect x="48" y="110" width="504" height="360" rx="5" fill="url(#photoBlank)" stroke="#111314" stroke-width="4"/></g><g id="photo-slot-2" data-photo-slot="2"><rect x="48" y="490" width="504" height="360" rx="5" fill="url(#photoBlank)" stroke="#111314" stroke-width="4"/></g><g id="photo-slot-3" data-photo-slot="3"><rect x="48" y="870" width="504" height="360" rx="5" fill="url(#photoBlank)" stroke="#111314" stroke-width="4"/></g></g>
 
 <g id="track-info" font-family="Arial,sans-serif">
  <text x="50" y="1305" font-size="42" font-weight="700" fill="#fff">Your Title Here</text>
  <text x="50" y="1353" font-size="29.4" fill="#999">Your Subtitle Here</text>
  <rect x="50" y="1387" width="500" height="5" rx="2.5" fill="#6d7072"/><rect x="50" y="1387" width="75" height="5" rx="2.5" fill="#fff"/><circle cx="125" cy="1389.5" r="8" fill="#fff"/>
  <text x="50" y="1427" font-size="20" fill="#aaa">0:00</text><text x="550" y="1427" text-anchor="end" font-size="20" fill="#aaa">3:30</text>
 </g>
 <g id="player-controls" fill="#f8f8f8" stroke="#f8f8f8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M50 1645C25 1616,-10 1647,50 1698C110 1647,75 1616,50 1645Z" fill="none" stroke-width="4"/>
  <path d="M180 1622v56M185 1650l48-34v68Z" stroke-width="5"/>
  <circle cx="300" cy="1650" r="49" fill="#fff"/><rect x="284" y="1628" width="10" height="44" rx="4" fill="#101112" stroke="none"/><rect x="307" y="1628" width="10" height="44" rx="4" fill="#101112" stroke="none"/>
  <path d="M415 1622v56M410 1650l-48-34v68Z" stroke-width="5"/>
  <circle cx="550" cy="1650" r="22" fill="none" stroke-width="3"/><path d="M542 1642l18 8-18 8Z"/>
 </g>
 <g id="utility-icons" stroke="#eee" fill="none" stroke-width="3"><rect x="50" y="1738" width="20" height="30" rx="3"/><rect x="75" y="1738" width="20" height="30" rx="3"/><path d="M505 1740h38M505 1753h38M505 1766h38"/></g>
</svg>
